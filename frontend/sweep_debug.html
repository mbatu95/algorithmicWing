<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Sweep Debug</title>
    <style>
        body {
            margin: 0;
            font-family: monospace;
        }

        #canvas {
            display: block;
        }

        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: #0f0;
            padding: 15px;
            font-size: 12px;
            max-width: 400px;
        }

        #info div {
            margin: 3px 0;
        }

        .error {
            color: #f00;
        }

        .ok {
            color: #0f0;
        }
    </style>
</head>

<body>
    <div id="info">Loading...</div>
    <canvas id="canvas"></canvas>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const info = document.getElementById('info');
        function log(msg, isError = false) {
            const div = document.createElement('div');
            div.className = isError ? 'error' : 'ok';
            div.textContent = msg;
            info.appendChild(div);
            console.log(msg);
        }

        // Scene
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(6, 6, 6);

        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas'), antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);

        const controls = new OrbitControls(camera, renderer.domElement);

        // Lights
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 10, 10);
        scene.add(dirLight);

        // Grid & axes
        scene.add(new THREE.GridHelper(20, 20, 0x444444, 0x222222));
        scene.add(new THREE.AxesHelper(5));

        info.innerHTML = '';
        log('Starting sweep test...');

        // Generate data
        const radius = 0.3;
        const circlePoints = 30;
        const crossSection = [];
        for (let i = 0; i < circlePoints; i++) {
            const angle = (i / circlePoints) * Math.PI * 2;
            crossSection.push([Math.cos(angle) * radius, Math.sin(angle) * radius]);
        }
        log(`✓ Cross-section: ${circlePoints} points, radius ${radius}`);

        const controlPoints = [
            [0, 0, 0],
            [2, 1, 1],
            [1, 3, -1],
            [3, 5, 2],
            [4, 6, 0],
            [4, 1, 5]

        ];
        log(`✓ Control points: ${controlPoints.length} points`);

        // Fetch
        (async () => {
            try {
                log('→ Sending POST to /sweep...');
                const response = await fetch('http://localhost:8001/sweep', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        cross_section: crossSection,
                        control_points: controlPoints,
                        num_points: 100
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                log(`✓ Received: ${data.vertices.length} vertices, ${data.faces.length} faces`);

                if (data.vertices.length === 0 || data.faces.length === 0) {
                    log('❌ Empty mesh!', true);
                    return;
                }

                // Check bounds
                let minX = Infinity, maxX = -Infinity;
                let minY = Infinity, maxY = -Infinity;
                let minZ = Infinity, maxZ = -Infinity;
                for (const v of data.vertices) {
                    minX = Math.min(minX, v[0]);
                    maxX = Math.max(maxX, v[0]);
                    minY = Math.min(minY, v[1]);
                    maxY = Math.max(maxY, v[1]);
                    minZ = Math.min(minZ, v[2]);
                    maxZ = Math.max(maxZ, v[2]);
                }
                log(`  X: ${minX.toFixed(2)} to ${maxX.toFixed(2)}`);
                log(`  Y: ${minY.toFixed(2)} to ${maxY.toFixed(2)}`);
                log(`  Z: ${minZ.toFixed(2)} to ${maxZ.toFixed(2)}`);

                // Build geometry
                const geometry = new THREE.BufferGeometry();
                const vertices = new Float32Array(data.vertices.flat());
                geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));

                const indices = new Uint32Array(data.faces.flat());
                geometry.setIndex(new THREE.BufferAttribute(indices, 1));

                geometry.computeVertexNormals();
                log('✓ Geometry created');

                // Material
                const material = new THREE.MeshStandardMaterial({
                    color: 0x00ff00,
                    metalness: 0.3,
                    roughness: 0.5,
                    side: THREE.DoubleSide
                });

                // Mesh
                const mesh = new THREE.Mesh(geometry, material);
                scene.add(mesh);
                log('✓ Mesh added to scene');

                // Center camera
                const box = new THREE.Box3().setFromObject(mesh);
                const center = box.getCenter(new THREE.Vector3());
                controls.target.copy(center);
                camera.position.set(center.x + 6, center.y + 6, center.z + 6);
                log(`✓ Camera centered at (${center.x.toFixed(1)}, ${center.y.toFixed(1)}, ${center.z.toFixed(1)})`);

            } catch (err) {
                log(`❌ Error: ${err.message}`, true);
                console.error(err);
            }
        })();

        // Animate
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
