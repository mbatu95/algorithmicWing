<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweep Visualization</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #canvas {
            display: block;
        }

        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 20px;
            border-radius: 8px;
            max-width: 300px;
        }

        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 10px;
            width: 100%;
        }

        button:hover {
            background: #45a049;
        }

        #info {
            margin-top: 10px;
            font-size: 12px;
            color: #aaa;
        }
    </style>
</head>

<body>
    <div id="controls">
        <h3>Sweep Visualization</h3>
        <button onclick="generateSweep()">Generate Sweep</button>
        <div id="info"></div>
    </div>
    <canvas id="canvas"></canvas>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(5, 5, 5);

        const renderer = new THREE.WebGLRenderer({
            canvas: document.getElementById('canvas'),
            antialias: true
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        // Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 10, 7);
        scene.add(directionalLight);

        // Grid
        const gridHelper = new THREE.GridHelper(20, 20, 0x444444, 0x222222);
        scene.add(gridHelper);

        // Axes helper
        const axesHelper = new THREE.AxesHelper(5);
        scene.add(axesHelper);

        let sweptMesh = null;

        // Generate sweep function
        window.generateSweep = async function () {
            // Create a circle cross-section
            const circlePoints = 30;
            const radius = 0.1;
            const crossSection = [];
            for (let i = 0; i < circlePoints; i++) {
                const angle = (i / circlePoints) * Math.PI * 2;
                crossSection.push([
                    Math.cos(angle) * radius,
                    Math.sin(angle) * radius
                ]);
            }

            // Define Bezier control points for a smooth curve
            const controlPoints = [
                [0, 0, 0],      // Start
                [2, 1, 1],      // Control 1
                [4, 3, 1],      // Control 1
                [6, 2, 1],      // Control 1

                // End
            ];

            try {
                const response = await fetch('http://localhost:8001/sweep', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        cross_section: crossSection,
                        control_points: controlPoints,  // Use Bezier
                        num_points: 100                 // Smoothness
                    })
                });

                const data = await response.json();

                // Remove old mesh
                if (sweptMesh) {
                    scene.remove(sweptMesh);
                    sweptMesh.geometry.dispose();
                    sweptMesh.material.dispose();
                }

                // Create geometry from vertices and faces
                const geometry = new THREE.BufferGeometry();

                // Flatten vertices array
                const vertices = new Float32Array(data.vertices.flat());
                geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));

                // Flatten faces array
                const indices = new Uint32Array(data.faces.flat());
                geometry.setIndex(new THREE.BufferAttribute(indices, 1));

                // Compute normals
                geometry.computeVertexNormals();

                // Create material
                const material = new THREE.MeshStandardMaterial({
                    color: 0x4CAF50,
                    metalness: 0.3,
                    roughness: 0.4,
                    side: THREE.DoubleSide
                });

                // Create mesh
                sweptMesh = new THREE.Mesh(geometry, material);
                scene.add(sweptMesh);

                // Update info
                document.getElementById('info').innerHTML = `
                    <strong>Generated!</strong><br>
                    Vertices: ${data.vertices.length}<br>
                    Faces: ${data.faces.length}
                `;

                // Center camera on mesh
                const box = new THREE.Box3().setFromObject(sweptMesh);
                const center = box.getCenter(new THREE.Vector3());
                controls.target.copy(center);

            } catch (error) {
                console.error('Error:', error);
                document.getElementById('info').innerHTML = `
                    <strong style="color: #ff6b6b;">Error:</strong><br>
                    ${error.message}
                `;
            }
        };

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Start animation
        animate();

        // Generate on load
        generateSweep();
    </script>
</body>

</html>
